name = "truerank"
account_id = "06c8d26cd83f87b95cd1d5467cb712a2"
main = "worker/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "chrisputer.tech/*", zone_name = "chrisputer.tech" },
  { pattern = "www.chrisputer.tech/*", zone_name = "chrisputer.tech" },
  { pattern = "research.chrisputer.tech/*", zone_name = "chrisputer.tech" },
]

[assets]
directory = "./public"
binding = "ASSETS"
# Run the Worker first so it can inject a per-request CSP nonce into HTML.
run_worker_first = true

[triggers]
crons = ["*/10 * * * *"]

[limits]
cpu_ms = 300000

[vars]
ENVIRONMENT = "production"
MONTHLY_BUDGET_USD = "60"
# Programmatic-SEO flywheel: max keyword research runs the cron will start per
# UTC day. The flywheel also stays dormant until SERPER_API_KEY is set.
# Raised 6->12 (2026-07-01, full eval): budget was 19% utilized ($11/mo of $60)
# and the queue was refilled with 200 real-Google-popularity keywords (autocomplete
# harvest) — the constraint was queue depth + cap, not budget. 12/day drains the
# ~280-keyword queue over ~3 weeks and adds ~$13/mo, leaving room for organic growth.
FLYWHEEL_DAILY_MAX = "12"
# EXTERNAL_WORKER_ENABLED routes research processing. BOTH paths run the SAME honest
# deterministic extraction synth (synthesizeHonest) — it cannot fabricate wherever it runs:
#   "false" (DEFAULT + SAFE ROLLBACK): the CF-side runEngine (SYNTH_ENGINE=extract below)
#           gathers + synthesizes on Cloudflare. Self-contained, no homelab dependency, but
#           bounded by the Worker 300s CPU limit (capped source mining → thinner).
#   "true"  (FORWARD CUTOVER, comprehensive): hands jobs to the off-CF "blackbox" worker,
#           which GATHERS + SYNTHESIZES on the idle homelab (no CPU ceiling → unlimited source
#           mining). It posts a finished result; CF just re-validates structure + persists.
# ROLLBACK during an incident = set this to "false" (NOT "true"). Only set "true" AFTER the
# updated research-worker.mjs (gather + synth) is deployed to the homelab.
EXTERNAL_WORKER_ENABLED = "false"
# Synthesis engine: 'extract' = the deterministic, can't-fabricate ML engine + gated
# LLM con-selector (grounding 0.80 vs the LLM synth's 0.30 on real pages). Unset/any
# other value falls back to the kimi LLM synth.
SYNTH_ENGINE = "extract"
# METRICS_TOKEN is intentionally NOT in [vars] — it is a secret, set via
# `npx wrangler secret put METRICS_TOKEN`. /metrics returns 503 until it exists.
ADSENSE_PUBLISHER_ID = "pub-6952672558994325"
ADSENSE_SLOT_TOP = "2568816027"
ADSENSE_SLOT_MID = "8942652687"
ADSENSE_SLOT_BOTTOM = "7765302384"
AMAZON_AFFILIATE_TAG = "battlesheep0a-20"
CF_ANALYTICS_TOKEN = "ea97bb136135401584c3547bd0d73b66"
# IndexNow verification key. Intentionally public — the protocol requires it to
# be hosted at https://chrisputer.tech/<key>.txt (served by the worker route).
INDEXNOW_KEY = "2b049a04674b366dc9b485b792ad823e"
# Outbound email (docs/email-design.md). MAIL_ENABLED is the emergency off
# switch AND the release gate: "false" turns every send into a logged skip, so
# subscribe, confirm and unsubscribe keep working and nothing leaves the
# worker.
#
# OFF since 2026-08-03. The SMTP transport cannot work from a deployed Worker.
# smtp.hostinger.com resolves to 172.65.255.143 (AS13335, CLOUDFLARENET), and
# Cloudflare blocks outbound TCP from Workers to its own IP ranges. Every
# Hostinger mail endpoint (smtp, mx1, mx2) is behind the same network, so no
# port and no hostname avoids it. Measured at the edge: connect() to
# 8.8.8.8:853 succeeds, connect() to smtp.hostinger.com:465 and :587 both fail
# in under 20 ms with "proxy request failed, cannot connect to the specified
# address". `wrangler dev` passed only because it egresses from the LAN.
# Turning this back on needs a transport change (docs/email-design.md s.3),
# not a config change. See issues.md 2026-08-03.
MAIL_ENABLED = "false"
MAIL_FROM = "chris@chrisputer.tech"
MAIL_FROM_NAME = "Frank"
SMTP_HOST = "smtp.hostinger.com"
SMTP_PORT = "465"                # implicit TLS; v1 supports 465 only
MAIL_DAILY_CAP = "200"           # global outbound ceiling per UTC day
# (GOOGLE_CSE_ID removed 2026-06-16: the /find Programmable Search Engine widget
# was retired — /find now 302-redirects to a plain Google search, so the CSE id
# is dead config. No code reads env.GOOGLE_CSE_ID.)

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "truerank-db"
database_id = "d02b3826-a46a-4821-8f3a-6e3a80407155"

# KV Namespace
[[kv_namespaces]]
binding = "KV"
id = "e4ac5aa9e3514eb58612b5c79956bf51"

# Queue Producer
[[queues.producers]]
binding = "RESEARCH_QUEUE"
queue = "truerank-research"

# Queue Consumer
[[queues.consumers]]
queue = "truerank-research"
max_batch_size = 1
max_retries = 2
dead_letter_queue = "truerank-dlq"

# Burst gate for the checked POST paths (research/verify/chat/auth).
# Atomic per colo = atomic per attacking source. Layered in front of the
# KV hourly window, which stays the volume ceiling. Free, GA, wrangler >= 4.36.
# namespace_id is an arbitrary string unique inside this Worker; no dashboard
# resource exists. Design: docs/rate-limit-design.md.
# Rollback: delete this block. worker/lib/burst-gate.js fail-opens when
# env.RL_BURST is undefined and KV keeps enforcing the hourly caps.
[[ratelimits]]
name = "RL_BURST"
namespace_id = "1001"
[ratelimits.simple]
limit = 10
period = 60

# SITE-WIDE gate for the affiliate redirect surface (/api/go/*). Separate
# binding from RL_BURST so the two tunings stay independent. Called with a
# CONSTANT key, so every request on the site shares ONE counter: that is what
# catches an IP-rotating bot, which a per-IP cap cannot see (incident
# 2026-08-14/15: 1,232 clicks, 1,232 distinct IPs, ~1 click each).
# 6 per 60 s = a 360/hour site ceiling, 15x the busiest hour ever recorded and
# 2x the busiest real minute. Sizing data: worker/lib/affiliate-gate.js.
# Rollback: delete this block. worker/lib/affiliate-gate.js fail-opens when
# env.RL_AFFILIATE_GLOBAL is undefined and the per-IP KV cap still applies.
[[ratelimits]]
name = "RL_AFFILIATE_GLOBAL"
namespace_id = "1002"
[ratelimits.simple]
limit = 6
period = 60

# Secrets (set via wrangler secret put; values live in BWS, names only here).
# Set in production (wrangler secret list, 2026-10-19):
# OPENROUTER_API_KEY  — paid OpenRouter key (planner/synth/classifier models)
# LLM_PROVIDER        — "litellm" routes LLM calls through LiteLLM, OpenRouter fallback
# LITELLM_BASE_URL    — LiteLLM proxy address
# LITELLM_API_KEY     — LiteLLM proxy key
# LITELLM_GATE_TOKEN  — X-Edge-Gate header for the LiteLLM and SearXNG edge
# SEARXNG_URL         — self-hosted SearXNG, first web search provider
# EXA_API_KEY         — Exa web search, fallback after SearXNG
# JINA_API_KEY        — lifts Jina Reader's free rate cap for read_page
# WORKER_SECRET       — gates /api/internal/* and forceFresh
# METRICS_TOKEN       — bearer token for /metrics (503 until set)
# GSC_SA_KEY          — Google Search Console service-account key
# TRUERANK_SMTP_USER  — full Hostinger mailbox address (also the From address)
# TRUERANK_SMTP_PASSWORD — mailbox password. Without BOTH, every send is a
#                      logged no-op, so local dev and CI can never send mail.
# Optional, not set in production (the code skips them when absent):
# SERPER_API_KEY      — Serper.dev Google Search (removed from production 2026-10-08)
# BRAVE_API_KEY       — Brave web search (deleted 2026-10-15, out of credit)
# TAVILY_API_KEY      — Tavily web search (local benchmarks)
# IP_HASH_SALT        — salt for IP hashes (falls back to WORKER_SECRET)
# AMAZON_ASSOCIATE_TAG — AMAZON_AFFILIATE_TAG in [vars] is the default
